openapi: 3.1.0
info:
  title: Slot Booking API
  version: 1.0.0
  description: REST API for creating events and managing capacity-limited reservations.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /auth/register:
    post:
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 72 }
      responses:
        '201': { description: Account created }
        '409': { description: Email already exists }
  /auth/login:
    post:
      summary: Sign in and obtain an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Bearer token returned }
        '401': { description: Credentials rejected }
  /events:
    get:
      summary: List events
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { in: query, name: offset, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200': { description: Events and remaining seat counts }
    post:
      summary: Create an event
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201': { description: Event created }
        '401': { description: Authentication required }
  /events/{eventId}:
    parameters:
      - { in: path, name: eventId, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get event details
      responses:
        '200': { description: Event returned }
        '404': { description: Event not found }
    patch:
      summary: Update an event created by the signed-in user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPatch'
      responses:
        '200': { description: Event updated }
        '403': { description: Caller is not the event creator }
        '409': { description: Capacity is below confirmed reservations }
  /events/{eventId}/reservations:
    post:
      summary: Reserve one seat; repeat requests return the existing reservation
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Reservation created }
        '200': { description: Existing active reservation returned }
        '409': { description: Event is full or has started }
  /events/{eventId}/reservations/me:
    delete:
      summary: Cancel the signed-in user's reservation
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Reservation cancelled }
  /reservations/me:
    get:
      summary: List the signed-in user's reservations
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reservations returned }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EventInput:
      type: object
      required: [title, description, startsAt, capacity]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 10000 }
    EventPatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 10000 }
